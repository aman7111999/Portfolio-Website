<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1648 928" role="img" aria-label="Portfolio Analysis cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13233b"/>
      <stop offset="0.44" stop-color="#06101e"/>
      <stop offset="1" stop-color="#020812"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0" cy="0" r="1" gradientTransform="translate(180 170) rotate(32) scale(590 520)">
      <stop stop-color="#294568" stop-opacity=".75"/>
      <stop offset="1" stop-color="#0a1424" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0" cy="0" r="1" gradientTransform="translate(1375 735) rotate(135) scale(420 330)">
      <stop stop-color="#c6914e" stop-opacity=".20"/>
      <stop offset="1" stop-color="#0a1424" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d4a554"/><stop offset="1" stop-color="#ffe1a7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#142136" stop-opacity=".96"/>
      <stop offset="1" stop-color="#0a1221" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#26354a" stop-opacity=".96"/>
      <stop offset=".45" stop-color="#101a2a" stop-opacity=".98"/>
      <stop offset="1" stop-color="#090f1b" stop-opacity=".99"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7850ff"/><stop offset="1" stop-color="#ad6aff"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#70d7d4"/><stop offset="1" stop-color="#2f8d9f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity=".62"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="screenClip"><rect x="0" y="0" width="716" height="632" rx="30"/></clipPath>
  </defs>

  <rect width="1648" height="928" fill="url(#bg)"/>
  <rect width="1648" height="928" fill="url(#glowL)"/>
  <rect width="1648" height="928" fill="url(#glowR)"/>

  <!-- subtle floor -->
  <ellipse cx="1188" cy="872" rx="430" ry="58" fill="#000" opacity=".48" filter="url(#soft)"/>

  <!-- left content -->
  <g transform="translate(100 212)">
    <text x="0" y="92" fill="#f8f3e9" font-size="112" font-family="Georgia, 'Times New Roman', serif" font-weight="400" letter-spacing="-4">Portfolio</text>
    <text x="0" y="210" fill="#f8f3e9" font-size="112" font-family="Georgia, 'Times New Roman', serif" font-weight="400" letter-spacing="-4">Analysis</text>
    <rect x="0" y="256" width="70" height="3" rx="2" fill="url(#gold)"/>
    <text x="0" y="308" fill="#edf1f7" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="400">Understand your portfolio.</text>
    <text x="0" y="344" fill="#f3ca78" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="400">Not just your holdings.</text>

    <g transform="translate(0 398)" font-family="Inter, Arial, sans-serif" font-size="17" fill="#f4f6fa">
      <g><rect width="170" height="54" rx="27" fill="#091321" stroke="#728199" stroke-opacity=".72"/><path d="M24 34l10-10 8 6 12-16" fill="none" stroke="#e7bc62" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="54" cy="14" r="3" fill="#e7bc62"/><text x="68" y="34">Performance</text></g>
      <g transform="translate(186 0)"><rect width="150" height="54" rx="27" fill="#091321" stroke="#728199" stroke-opacity=".72"/><circle cx="31" cy="27" r="11" fill="none" stroke="#6d8fff" stroke-width="2.4"/><path d="M31 16v12h12" fill="none" stroke="#6d8fff" stroke-width="2.4" stroke-linecap="round"/><text x="52" y="34">Allocation</text></g>
      <g transform="translate(352 0)"><rect width="120" height="54" rx="27" fill="#091321" stroke="#728199" stroke-opacity=".72"/><path d="M28 16l9 4v8c0 7-4 11-9 14-5-3-9-7-9-14v-8z" fill="none" stroke="#9f70ff" stroke-width="2.2"/><path d="M28 23v11" stroke="#9f70ff" stroke-width="2"/><text x="52" y="34">Risk</text></g>
      <g transform="translate(488 0)"><rect width="192" height="54" rx="27" fill="#091321" stroke="#728199" stroke-opacity=".72"/><g fill="#66d4d0"><circle cx="28" cy="27" r="3"/><circle cx="39" cy="18" r="2.5"/><circle cx="45" cy="31" r="2.5"/><circle cx="34" cy="38" r="2.5"/><circle cx="19" cy="20" r="2.5"/><circle cx="18" cy="34" r="2.5"/></g><text x="60" y="34">Diversification</text></g>
    </g>
  </g>

