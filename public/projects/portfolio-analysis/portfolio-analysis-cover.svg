    <rect x="0" y="0" width="716" height="632" rx="30" fill="url(#screen)" stroke="#71809a" stroke-opacity=".55" stroke-width="1.5"/>
    <g clip-path="url(#screenClip)">
      <!-- performance -->
      <g transform="translate(24 24)">
        <rect width="322" height="272" rx="16" fill="url(#panel)" stroke="#536079" stroke-opacity=".65"/>
        <circle cx="29" cy="31" r="6" fill="#e4b75c"/><text x="46" y="37" fill="#f2f4f8" font-size="17" font-family="Inter,Arial" font-style="italic">Performance</text>
        <path d="M27 219C55 198 72 186 94 190s39-25 62-7 49-27 72-7 38-32 58-56" fill="none" stroke="#f4c861" stroke-width="3" stroke-linecap="round"/>
        <path d="M27 219C55 198 72 186 94 190s39-25 62-7 49-27 72-7 38-32 58-56V238H27z" fill="#d9a947" opacity=".12"/>
        <circle cx="286" cy="120" r="7" fill="#ffd77b"/>
        <line x1="28" y1="240" x2="290" y2="240" stroke="#59657a" stroke-opacity=".35" stroke-dasharray="3 4"/>
      </g>
      <!-- allocation -->
