    <rect x="0" y="0" width="226" height="310" rx="22" fill="#101b2b" stroke="#33435a"/>
    <text x="22" y="42" fill="#8e9cb0" font-size="16" font-family="Inter, Arial">Overview</text>
    <circle cx="88" cy="110" r="43" fill="none" stroke="#314157" stroke-width="14"/>
    <path d="M88 67a43 43 0 0 1 33 70" fill="none" stroke="#61768f" stroke-width="14"/>
    <g fill="#35465d"><rect x="28" y="184" width="138" height="9" rx="5"/><rect x="28" y="210" width="116" height="9" rx="5"/><rect x="28" y="236" width="94" height="9" rx="5"/></g>
  </g>
  <g opacity=".30" transform="translate(1450 220) rotate(7)">
