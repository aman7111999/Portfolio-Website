    <text x="20" y="48" fill="#9aa7b8" font-size="16" font-family="Inter, Arial">Insights</text>
    <g fill="#3d4c63"><rect x="20" y="84" width="126" height="8" rx="4"/><rect x="20" y="108" width="102" height="8" rx="4"/><rect x="20" y="132" width="138" height="8" rx="4"/><rect x="20" y="190" width="120" height="8" rx="4"/><rect x="20" y="214" width="98" height="8" rx="4"/></g>
    <g fill="#40516b"><rect x="28" y="304" width="11" height="82" rx="5"/><rect x="50" y="330" width="11" height="56" rx="5"/><rect x="72" y="286" width="11" height="100" rx="5"/><rect x="94" y="316" width="11" height="70" rx="5"/></g>
  </g>

