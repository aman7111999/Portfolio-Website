        <rect width="322" height="272" rx="16" fill="url(#panel)" stroke="#536079" stroke-opacity=".65"/>
        <circle cx="29" cy="31" r="6" fill="#6387ff"/><text x="46" y="37" fill="#f2f4f8" font-size="17" font-family="Inter,Arial" font-style="italic">Allocation</text>
        <g transform="translate(92 145) rotate(-90)">
          <circle r="62" fill="none" stroke="#152238" stroke-width="26"/>
          <circle r="62" fill="none" stroke="#5574e9" stroke-width="26" stroke-dasharray="82 308" stroke-dashoffset="0"/>
          <circle r="62" fill="none" stroke="#596ac7" stroke-width="26" stroke-dasharray="68 322" stroke-dashoffset="-88"/>
          <circle r="62" fill="none" stroke="#4b9c9b" stroke-width="26" stroke-dasharray="80 310" stroke-dashoffset="-162"/>
          <circle r="62" fill="none" stroke="#5ea9ba" stroke-width="26" stroke-dasharray="68 322" stroke-dashoffset="-248"/>
          <circle r="62" fill="none" stroke="#d6a553" stroke-width="26" stroke-dasharray="46 344" stroke-dashoffset="-322"/>
        </g>
        <g fill="#4b5870"><rect x="190" y="83" width="74" height="9" rx="5"/><rect x="190" y="119" width="88" height="9" rx="5"/><rect x="190" y="155" width="66" height="9" rx="5"/><rect x="190" y="191" width="95" height="9" rx="5"/></g>
        <g><circle cx="171" cy="87" r="5" fill="#6387ff"/><circle cx="171" cy="123" r="5" fill="#8c6fe7"/><circle cx="171" cy="159" r="5" fill="#66a9d8"/><circle cx="171" cy="195" r="5" fill="#66b9a7"/></g>
      </g>
      <!-- risk -->
      <g transform="translate(24 316)">
        <rect width="322" height="280" rx="16" fill="url(#panel)" stroke="#536079" stroke-opacity=".65"/>
        <circle cx="29" cy="31" r="6" fill="#9b69f5"/><text x="46" y="37" fill="#f2f4f8" font-size="17" font-family="Inter,Arial" font-style="italic">Risk</text>
        <path d="M20 173C44 126 60 197 85 150S129 107 150 155s44 17 65-9 42-21 75 10" fill="none" stroke="url(#risk)" stroke-width="3" stroke-linecap="round"/>
        <path d="M20 173C44 126 60 197 85 150S129 107 150 155s44 17 65-9 42-21 75 10" fill="none" stroke="#9d6dff" stroke-opacity=".22" stroke-width="22"/>
        <path d="M22 215C55 195 73 228 103 206s53-17 79 1 56 6 106 12" fill="none" stroke="#7651df" stroke-opacity=".25" stroke-width="2"/>
        <g stroke="#536079" stroke-opacity=".25" stroke-dasharray="3 4"><line x1="20" y1="92" x2="292" y2="92"/><line x1="20" y1="132" x2="292" y2="132"/><line x1="20" y1="220" x2="292" y2="220"/></g>
      </g>
      <!-- diversification -->
      <g transform="translate(370 316)">
        <rect width="322" height="280" rx="16" fill="url(#panel)" stroke="#536079" stroke-opacity=".65"/>
        <circle cx="29" cy="31" r="6" fill="#5dc6c4"/><text x="46" y="37" fill="#f2f4f8" font-size="17" font-family="Inter,Arial" font-style="italic">Diversification</text>
        <g transform="translate(163 165)" fill="none" stroke="#4c8493" stroke-opacity=".42"><circle r="34"/><circle r="62"/><circle r="90"/><line x1="-100" y1="0" x2="100" y2="0" opacity=".25"/><line x1="0" y1="-100" x2="0" y2="100" opacity=".25"/></g>
        <circle cx="163" cy="165" r="8" fill="#7be0da" filter="url(#soft)" opacity=".7"/><circle cx="163" cy="165" r="5" fill="#8af1e9"/>
        <g fill="#5ccac4"><circle cx="163" cy="82" r="3.5"/><circle cx="234" cy="111" r="3.5"/><circle cx="249" cy="168" r="3.5"/><circle cx="219" cy="225" r="3.5"/><circle cx="127" cy="231" r="3.5"/><circle cx="82" cy="188" r="3.5"/><circle cx="99" cy="129" r="3.5"/><circle cx="195" cy="95" r="2.7"/></g>
      </g>
    </g>
    <rect x="0" y="0" width="716" height="632" rx="30" fill="none" stroke="#f7d7aa" stroke-opacity=".28"/>
  </g>

  <rect x="0" y="0" width="1648" height="928" fill="none" stroke="#fff" stroke-opacity=".025"/>
